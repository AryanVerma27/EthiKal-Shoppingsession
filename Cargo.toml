[package]
name = "sessions"
version = "0.1.0"
edition = "2021"

[dependencies]
memchr = "2"
hashbrown = "0.15"
parquet = { version = "55", default-features = false, features = ["arrow"] }
arrow-array = "55"
arrow-schema = "55"
mimalloc = { version = "0.1", default-features = false }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
debug = false
